# XcodeGen spec. Generate with `xcodegen generate`; SkiPass.xcodeproj is git-ignored.
name: SkiPass

options:
  bundleIdPrefix: io.github.rkceve
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en

configFiles:
  Debug: ios/Config/Base.xcconfig
  Release: ios/Config/Base.xcconfig

settings:
  base:
    MARKETING_VERSION: "0.1.6"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""

packages:
  SkiPassCore:
    path: ios/SkiPassCore
  SkiPassUI:
    path: ios/SkiPassUI
  RevenueCat:
    # https://github.com/RevenueCat/purchases-ios/releases/tag/5.91.0 (latest release on 2026-09-23)
    url: https://github.com/RevenueCat/purchases-ios
    exactVersion: 5.91.0

targets:
  SkiPass:
    type: application
    platform: iOS
    sources:
      - path: ios/App
        excludes:
          - Tests
      # One-time-code identity registration + bundled sign-in-domains.json, shared with the extension.
      - path: ios/Extension/Identity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rkceve.skipass
        PRODUCT_NAME: SkiPass
        INFOPLIST_FILE: ios/Config/SkiPass-Info.plist
        # ios/App/Assets.xcassets/AppIcon.appiconset: single-size 1024x1024 icon; Xcode generates
        # the other sizes ("Primary App Icon Set Name",
        # https://developer.apple.com/documentation/xcode/configuring-your-app-icon).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: ios/Config/SkiPass.entitlements
    dependencies:
      - package: SkiPassCore
        product: SkiPassModels
      - package: SkiPassCore
        product: SkiPassStorage
      - package: SkiPassCore
        product: SkiPassAuth
      - package: SkiPassCore
        product: SkiPassAuthUI
      - package: SkiPassCore
        product: SkiPassServerClient
      - package: SkiPassUI
        product: SkiPassUI
      - package: RevenueCat
        product: RevenueCat
      - target: SkiPassAutoFill
        embed: true

  SkiPassAutoFill:
    type: app-extension
    platform: iOS
    sources:
      - path: ios/Extension
        excludes:
          - Info.plist
          - "*.entitlements"
          - Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rkceve.skipass.autofill
        PRODUCT_NAME: SkiPassAutoFill
        INFOPLIST_FILE: ios/Extension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ios/Extension/SkiPassAutoFill.entitlements
    dependencies:
      - package: SkiPassCore
        product: SkiPassModels
      - package: SkiPassCore
        product: SkiPassStorage
      - package: SkiPassCore
        product: SkiPassMail
      - package: SkiPassCore
        product: SkiPassAuth
      - package: SkiPassCore
        product: SkiPassExtraction
      - package: SkiPassCore
        product: SkiPassServerClient
      - sdk: AuthenticationServices.framework

  # Unit tests for AppModel (ios/App/Tests), hosted in the app.
  SkiPassAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ios/App/Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rkceve.skipass.apptests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) SKIPASS_APP_TESTS"
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/SkiPass.app/SkiPass
        BUNDLE_LOADER: $(TEST_HOST)
    dependencies:
      - target: SkiPass
      - package: SkiPassCore
        product: SkiPassModels
      - package: SkiPassUI
        product: SkiPassUI

  # Unit tests for the extension's UI-free resolver; compiles the resolver sources directly (no host).
  SkiPassExtensionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ios/Extension/Resolver
      - path: ios/Extension/Identity
      - path: ios/Extension/Tests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rkceve.skipass.extensiontests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - package: SkiPassCore
        product: SkiPassModels

  # Feasibility probe (not shipped, tools/probe/): OTP AutoFill from a third-party provider in the Simulator.
  SkiPassProbe:
    type: application
    platform: iOS
    sources:
      - path: tools/probe/ios/App
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: tools/probe/ios/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rkceve.skipass.probe
        PRODUCT_NAME: SkiPassProbe
        INFOPLIST_FILE: tools/probe/ios/App/Info.plist
        CODE_SIGN_ENTITLEMENTS: tools/probe/ios/App/SkiPassProbe.entitlements
    dependencies:
      - target: SkiPassProbeAutoFill
        embed: true

  SkiPassProbeAutoFill:
    type: app-extension
    platform: iOS
    sources:
      - path: tools/probe/ios/AutoFill
        excludes:
          - Info.plist
          - "*.entitlements"
      - path: tools/probe/ios/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rkceve.skipass.probe.autofill
        PRODUCT_NAME: SkiPassProbeAutoFill
        INFOPLIST_FILE: tools/probe/ios/AutoFill/Info.plist
        CODE_SIGN_ENTITLEMENTS: tools/probe/ios/AutoFill/SkiPassProbeAutoFill.entitlements
    dependencies:
      - sdk: AuthenticationServices.framework

  # UI tour and store screenshots of the SkiPass app (DEBUG fixtures, no network).
  SkiPassUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ios/UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rkceve.skipass.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SkiPass
    dependencies:
      - target: SkiPass

  SkiPassProbeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: tools/probe/UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.rkceve.skipass.probe.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: SkiPassProbe
    dependencies:
      - target: SkiPassProbe

schemes:
  SkiPass:
    build:
      targets:
        SkiPass: all
        SkiPassAutoFill: all
    test:
      targets:
        - SkiPassAppTests
  SkiPassExtensionTests:
    build:
      targets:
        SkiPassExtensionTests: [test]
    test:
      targets:
        - SkiPassExtensionTests
  # UI tour recording (.github/workflows/tour.yml) and store screenshots
  # (.github/workflows/screenshots.yml): SkiPassUITests drives the SkiPass app.
  SkiPassTour:
    build:
      targets:
        SkiPass: all
        SkiPassAutoFill: all
        SkiPassUITests: [test]
    test:
      targets:
        - SkiPassUITests
  SkiPassProbe:
    build:
      targets:
        SkiPassProbe: all
        SkiPassProbeAutoFill: all
        SkiPassProbeUITests: [test]
    test:
      targets:
        - SkiPassProbeUITests
