name: ipa

# Builds a device (iphoneos) IPA for sideloading from Windows (e.g. Sideloadly with a free Apple ID).
# The app and extension are ad-hoc signed ("-") so their entitlements are embedded in the binaries;
# the sideloading tool re-signs them with the user's own certificate and provisioning profiles.
# Always Debug (docs/DECISIONS.md §7): the app uses a RevenueCat Test Store key, and purchases-ios crashes
# on purpose when a Test Store key is used in a Release build (Configuration.swift,
# checkForSimulatedStoreAPIKeyInRelease), so there is no Release option.
# The IPA embeds SkiPassAppToken; artifacts of this public repo are kept 3 days only.
on:
  workflow_dispatch:

env:
  CONFIG: Debug

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode
        run: bash .github/workflows/scripts/select-sim.sh
      # Proves the chain secret -> Secrets.xcconfig -> build setting -> Info.plist variable with
      # dummy values (safe to print), before the real secrets are written.
      - name: Check secret substitution with dummy values
        env:
          GOOGLE_CLIENT_ID: 123456789012-dummycheck.apps.googleusercontent.com
          MICROSOFT_CLIENT_ID: 11111111-2222-3333-4444-555555555555
          REVENUECAT_API_KEY: test_dummycheck
        run: |
          bash .github/workflows/scripts/write-secrets.sh
          brew install xcodegen && xcodegen generate
          settings=$(xcodebuild -showBuildSettings -project SkiPass.xcodeproj -target SkiPass -configuration Release 2>/dev/null)
          fail=0
          check() {
            actual=$(printf '%s\n' "$settings" | sed -n "s/^ *$1 = //p" | head -1)
            if [ "$actual" = "$2" ]; then echo "  $1 = $actual (ok)"; else echo "::error::$1 is '$actual', expected '$2'"; fail=1; fi
          }
          check GOOGLE_CLIENT_ID "$GOOGLE_CLIENT_ID"
          check GOOGLE_CLIENT_ID_PREFIX "123456789012-dummycheck"
          check MICROSOFT_CLIENT_ID "$MICROSOFT_CLIENT_ID"
          check REVENUECAT_API_KEY "$REVENUECAT_API_KEY"
          for key in GoogleClientID MicrosoftClientID RevenueCatAPIKey; do
            /usr/libexec/PlistBuddy -c "Print :$key" ios/Config/SkiPass-Info.plist
          done
          rm -f ios/Config/Secrets.xcconfig
          exit $fail
      - name: Write Secrets.xcconfig
        env:
          SKIPASS_SERVER_URL: ${{ secrets.SKIPASS_SERVER_URL }}
          SKIPASS_APP_TOKEN: ${{ secrets.SKIPASS_APP_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}
        run: bash .github/workflows/scripts/write-secrets.sh
      - name: Generate project
        run: xcodegen generate
      - name: Build for device
        run: |
          set -o pipefail
          xcodebuild build \
            -project SkiPass.xcodeproj -scheme SkiPass -configuration "$CONFIG" \
            -destination "generic/platform=iOS" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -skipMacroValidation -skipPackagePluginValidation \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM= CURRENT_PROJECT_VERSION=${{ github.run_number }} | tail -30
      - name: Package IPA
        run: |
          app="$RUNNER_TEMP/dd/Build/Products/$CONFIG-iphoneos/SkiPass.app"
          test -d "$app"
          # Secrets.xcconfig -> Info.plist check (values are never printed). A key still holding
          # the Secrets.example.xcconfig placeholder means the matching GitHub secret is not set.
          echo "Info.plist build configuration:"
          for key in GoogleClientID MicrosoftClientID RevenueCatAPIKey SkiPassServerURL SkiPassAppToken; do
            value=$(/usr/libexec/PlistBuddy -c "Print :$key" "$app/Info.plist" 2>/dev/null || true)
            case "$value" in
              ""|'$('*|*example*|00000000-0000-0000-0000-000000000000)
                echo "  $key: NOT configured (empty or example placeholder)"
                echo "::warning::$key is not configured in this IPA (secret missing)";;
              *) echo "  $key: configured";;
            esac
          done
          echo "Embedded entitlements (app):"; codesign -d --entitlements - "$app" 2>/dev/null || true
          echo "Embedded entitlements (extension):"; codesign -d --entitlements - "$app/PlugIns/"*.appex 2>/dev/null || true
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$app" "$RUNNER_TEMP/ipa/Payload/"
          # Resource bundles must not carry their own _CodeSignature (Sideloadly rejects/struggles otherwise).
          find "$RUNNER_TEMP/ipa/Payload" -path "*.bundle/_CodeSignature" -type d -prune -exec rm -rf {} +
          version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$app/Info.plist")
          build=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$app/Info.plist")
          name="SkiPass-v${version}-b${build}.ipa"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$name" Payload)
          echo "IPA_NAME=$name" >> "$GITHUB_ENV"
          ls -la "$RUNNER_TEMP/ipa/$name"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.IPA_NAME }}
          path: ${{ runner.temp }}/ipa/${{ env.IPA_NAME }}
          retention-days: 3
