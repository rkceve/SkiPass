name: tour

# Screen recording of a UI tour through every built screen (in-memory fixtures, no accounts,
# no network). Output artifact `ui-tour`: tour.mp4 (H.264, yuv420p, constant 60 fps by frame
# duplication), the original simulator tour.mov, and the .xcresult.
on:
  workflow_dispatch:

concurrency:
  group: tour-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tour:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - name: Select Xcode and simulator
        run: bash .github/workflows/scripts/select-sim.sh

      # Keep recordings comparable: pin the Xcode + iOS runtime pair of the verified recording
      # (select-sim.sh picks the newest, which drifts with runner image updates).
      - name: Pin Xcode and simulator runtime
        env:
          PIN_XCODE: /Applications/Xcode_26.3.0.app
          PIN_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-2
        run: |
          if [ "$XCODE_APP" != "$PIN_XCODE" ] || [ "$SIM_RUNTIME" != "$PIN_RUNTIME" ]; then
            test -d "$PIN_XCODE" || { echo "::error::pinned Xcode $PIN_XCODE is not installed"; exit 1; }
            sudo xcode-select -s "$PIN_XCODE/Contents/Developer"
            xcrun simctl list runtimes available | grep -q "$PIN_RUNTIME" \
              || { echo "::error::pinned runtime $PIN_RUNTIME is not available"; exit 1; }
            udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"].get(sys.argv[1], [])
          match = [d for d in devices if d["name"] == "iPhone 16"]
          print(match[0]["udid"] if match else "")' "$PIN_RUNTIME")
            [ -n "$udid" ] || udid=$(xcrun simctl create "iPhone 16" com.apple.CoreSimulator.SimDeviceType.iPhone-16 "$PIN_RUNTIME")
            {
              echo "XCODE_APP=$PIN_XCODE"
              echo "SIM_RUNTIME=$PIN_RUNTIME"
              echo "SIM_UDID=$udid"
            } >> "$GITHUB_ENV"
            echo "Re-selected pinned pair (select-sim.sh chose $XCODE_APP / $SIM_RUNTIME)"
          fi
          xcodebuild -version
          echo "Tour uses Xcode $PIN_XCODE with runtime $PIN_RUNTIME"

      - name: Install XcodeGen and generate
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Disable hardware keyboard for this simulator
        run: |
          plist="$HOME/Library/Preferences/com.apple.iphonesimulator.plist"
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          /usr/libexec/PlistBuddy -c "add :DevicePreferences dict" "$plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "add :DevicePreferences:$SIM_UDID dict" "$plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "add :DevicePreferences:$SIM_UDID:ConnectHardwareKeyboard bool false" "$plist" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "set :DevicePreferences:$SIM_UDID:ConnectHardwareKeyboard false" "$plist"
          /usr/libexec/PlistBuddy -c "print :DevicePreferences:$SIM_UDID" "$plist"

      - name: Boot simulator and override status bar
        run: |
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b
          # The hardware-keyboard preference is applied by Simulator.app, so run it attached to this device.
          open -a Simulator --args -CurrentDeviceUDID "$SIM_UDID"
          sleep 10
          xcrun simctl status_bar "$SIM_UDID" override --time 9:41 \
            --dataNetwork wifi --wifiMode active --wifiBars 3 \
            --cellularMode active --cellularBars 4 \
            --batteryState charged --batteryLevel 100

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project SkiPass.xcodeproj -scheme SkiPassTour \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath build/dd \
            -skipMacroValidation -skipPackagePluginValidation \
            | tee build-tour.log

      - name: Install SkiPass app
        run: xcrun simctl install "$SIM_UDID" build/dd/Build/Products/Debug-iphonesimulator/SkiPass.app

      - name: Run tour with screen recording
        id: test
        continue-on-error: true
        run: |
          mkdir -p out
          xcrun simctl io "$SIM_UDID" recordVideo --codec h264 --force out/tour.mov &
          rec=$!
          sleep 3
          set +e
          TEST_RUNNER_SKIPASS_TOUR=1 xcodebuild test-without-building \
            -project SkiPass.xcodeproj -scheme SkiPassTour \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath build/dd \
            -only-testing:SkiPassUITests/UITourTests \
            -resultBundlePath out/tour.xcresult \
            > out/test.log 2>&1
          status=$?
          set -e
          sleep 2
          kill -INT "$rec"
          wait "$rec" || true
          grep -E "error:|Test Case|passed|failed|skipped" out/test.log | head -100 || true
          # A skipped tour (runner env not passed) must not count as success.
          if grep -q "UITourTests testTour.*skipped\|Test skipped" out/test.log; then
            echo "tour test was skipped"; exit 1
          fi
          exit $status

      - name: Transcode to constant 60 fps MP4
        if: always()
        run: |
          command -v ffmpeg >/dev/null || brew install ffmpeg
          ls -la out
          test -s out/tour.mov
          # The simulator writes variable-frame-rate video (frames only when the screen changes).
          # fps=60 duplicates frames to a constant 60 fps (no interpolation); pad adds at most
          # one pixel so odd native sizes (e.g. 1179 wide) fit yuv420p.
          ffmpeg -hide_banner -y -i out/tour.mov \
            -vf "fps=60,pad=ceil(iw/2)*2:ceil(ih/2)*2" \
            -c:v libx264 -preset veryfast -crf 18 -pix_fmt yuv420p -movflags +faststart -an \
            out/tour.mp4
          ffprobe -hide_banner -v error -show_entries stream=codec_name,width,height,pix_fmt,r_frame_rate,avg_frame_rate,nb_frames:format=duration \
            -of default=noprint_wrappers=1 out/tour.mp4
          ffprobe -hide_banner -v error -show_entries stream=codec_name,width,height,r_frame_rate,avg_frame_rate,nb_frames:format=duration \
            -of default=noprint_wrappers=1 out/tour.mov

      - name: Collect attachments
        if: always()
        run: |
          mkdir -p out/attachments
          xcrun xcresulttool export attachments --path out/tour.xcresult --output-path out/attachments || true
          ls -la out/attachments | head -60
          cp build-tour.log out/ || true

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-tour
          path: |
            out/tour.mp4
            out/tour.mov
            out/tour.xcresult
            out/attachments
            out/test.log
            out/build-tour.log

      - name: Fail if tour test failed
        if: steps.test.outcome == 'failure'
        run: exit 1

  # The tour fixtures are DEBUG-only; prove they are absent from a Release build.
  release-excludes-fixtures:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode and simulator
        run: bash .github/workflows/scripts/select-sim.sh
      - name: Install XcodeGen and generate
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build Release
        run: |
          set -o pipefail
          xcodebuild build \
            -project SkiPass.xcodeproj -scheme SkiPass -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/dd \
            -skipMacroValidation -skipPackagePluginValidation \
            | tail -30
      - name: Check fixtures are compiled out
        run: |
          bin=build/dd/Build/Products/Release-iphonesimulator/SkiPass.app/SkiPass
          ls -la "$bin"
          if strings -a "$bin" | grep -E "SkiPassTourFixtures|TourFixtureModel|tour-fixture"; then
            echo "tour fixtures found in Release binary"; exit 1
          fi
          echo "Release binary contains no tour fixture symbols or strings"
