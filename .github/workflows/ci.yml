name: ci

on:
  push:
    branches: [main, "wip/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      unsigned_diagnostic:
        description: "Diagnostic only: build app with CODE_SIGNING_ALLOWED=NO to surface compile errors hidden behind signing failures"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core (SkiPassCore tests)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode and simulator
        run: bash .github/workflows/scripts/select-sim.sh
      - name: Test SkiPassCore
        working-directory: ios/SkiPassCore
        run: |
          set -o pipefail
          xcodebuild test \
            -scheme SkiPassCore-Package \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -skipMacroValidation -skipPackagePluginValidation \
            -resultBundlePath "$RUNNER_TEMP/core.xcresult" \
            | tee "$RUNNER_TEMP/core.log"
      - name: Upload result
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: core-result
          path: |
            ${{ runner.temp }}/core.xcresult
            ${{ runner.temp }}/core.log

  ui-package:
    name: ui-package (SkiPassUI build + tests)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode and simulator
        run: bash .github/workflows/scripts/select-sim.sh
      - name: Build and test SkiPassUI
        working-directory: ios/SkiPassUI
        run: |
          set -o pipefail
          # A package whose only product shares its name gets one scheme ("SkiPassUI"); otherwise
          # Xcode adds "<name>-Package" with every target. Use whichever carries the tests.
          scheme=SkiPassUI
          if xcodebuild -list 2>/dev/null | grep -q "SkiPassUI-Package"; then scheme=SkiPassUI-Package; fi
          echo "Scheme: $scheme"
          xcodebuild test \
            -scheme "$scheme" \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -resultBundlePath "$RUNNER_TEMP/ui.xcresult" \
            | tee "$RUNNER_TEMP/ui.log"
      - name: Upload log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-package-log
          path: |
            ${{ runner.temp }}/ui.xcresult
            ${{ runner.temp }}/ui.log

  app:
    name: app (SkiPass build + SkiPassAppTests)
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode and simulator
        run: bash .github/workflows/scripts/select-sim.sh
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Write Secrets.xcconfig
        env:
          SKIPASS_SERVER_URL: ${{ secrets.SKIPASS_SERVER_URL }}
          SKIPASS_APP_TOKEN: ${{ secrets.SKIPASS_APP_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}
        run: bash .github/workflows/scripts/write-secrets.sh
      - name: Generate project
        run: xcodegen generate
      - name: Build SkiPass and run SkiPassAppTests
        env:
          EXTRA_SETTINGS: ${{ inputs.unsigned_diagnostic && 'CODE_SIGNING_ALLOWED=NO' || '' }}
        run: |
          set -o pipefail
          xcodebuild test $EXTRA_SETTINGS \
            -project SkiPass.xcodeproj \
            -scheme SkiPass \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -skipMacroValidation -skipPackagePluginValidation \
            -resultBundlePath "$RUNNER_TEMP/app.xcresult" \
            | tee "$RUNNER_TEMP/app.log"
      - name: Upload log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: app-log
          path: |
            ${{ runner.temp }}/app.xcresult
            ${{ runner.temp }}/app.log

  extension:
    name: extension (SkiPassExtensionTests)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Select Xcode and simulator
        run: bash .github/workflows/scripts/select-sim.sh
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Run SkiPassExtensionTests
        run: |
          set -o pipefail
          xcodebuild test \
            -project SkiPass.xcodeproj \
            -scheme SkiPassExtensionTests \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -skipMacroValidation -skipPackagePluginValidation \
            -resultBundlePath "$RUNNER_TEMP/extension.xcresult" \
            | tee "$RUNNER_TEMP/extension.log"
      - name: Upload log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: extension-log
          path: |
            ${{ runner.temp }}/extension.xcresult
            ${{ runner.temp }}/extension.log

  server:
    name: server (npm test + typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: npm ci && npm test && npm run typecheck
        working-directory: server
        run: |
          npm ci
          npm test
          npm run typecheck
      # The Cloudflare Worker entry must keep bundling (docs/ARCHITECTURE.md §1); no deploy, no credentials.
      - name: Worker bundle (wrangler deploy --dry-run)
        working-directory: server
        run: npx wrangler deploy --dry-run --outdir "$RUNNER_TEMP/worker"

  demo-web:
    name: demo-web (npm test + typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: npm ci && npm test && npm run typecheck
        working-directory: demo-web
        run: |
          npm ci
          npm test
          npm run typecheck
