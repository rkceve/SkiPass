name: live-sim

# Interactive iOS Simulator in the browser, for manual UI checks from a non-Mac machine.
# Builds SkiPass, boots an iPhone 16 simulator, streams it with serve-sim (EvanBacon/serve-sim, Apache-2.0)
# and exposes it through a Cloudflare quick tunnel (no account). Anyone with the URL can control the
# simulator until the job ends, so the URL is published only encrypted with the LIVE_SIM_KEY secret,
# as the description of the commit status "live-sim" (decrypt command in the "Publish" step below).

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to keep the simulator online (max 300)"
        type: number
        default: 45

permissions:
  contents: read
  statuses: write

jobs:
  live:
    runs-on: macos-15
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Select Xcode and simulator
        run: bash .github/workflows/scripts/select-sim.sh
      - name: Install tools
        run: brew install xcodegen cloudflared
      - name: Write Secrets.xcconfig
        env:
          SKIPASS_SERVER_URL: ${{ secrets.SKIPASS_SERVER_URL }}
          SKIPASS_APP_TOKEN: ${{ secrets.SKIPASS_APP_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          MICROSOFT_CLIENT_ID: ${{ secrets.MICROSOFT_CLIENT_ID }}
          REVENUECAT_API_KEY: ${{ secrets.REVENUECAT_API_KEY }}
        run: bash .github/workflows/scripts/write-secrets.sh
      - name: Build SkiPass for the simulator
        run: |
          set -o pipefail
          xcodegen generate
          xcodebuild build \
            -project SkiPass.xcodeproj -scheme SkiPass \
            -destination "platform=iOS Simulator,id=$SIM_UDID" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -skipMacroValidation -skipPackagePluginValidation | tail -20
      - name: Boot, install, launch
        run: |
          xcrun simctl boot "$SIM_UDID" || true
          xcrun simctl bootstatus "$SIM_UDID" -b
          plist=~/Library/Preferences/com.apple.iphonesimulator.plist
          /usr/libexec/PlistBuddy -c "Add :DevicePreferences:$SIM_UDID:ConnectHardwareKeyboard bool false" "$plist" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :DevicePreferences:$SIM_UDID:ConnectHardwareKeyboard false" "$plist" || true
          open -a Simulator --args -CurrentDeviceUDID "$SIM_UDID"
          sleep 5
          xcrun simctl status_bar "$SIM_UDID" override --time 9:41 --batteryState charged --batteryLevel 100 || true
          xcrun simctl install "$SIM_UDID" "$RUNNER_TEMP/dd/Build/Products/Debug-iphonesimulator/SkiPass.app"
          xcrun simctl launch "$SIM_UDID" io.github.rkceve.skipass
      # serve-sim is pinned to an exact version (A3-09) and runs in a step without GH_TOKEN or other
      # credentials in its environment; it keeps running in the background after this step ends.
      - name: Stream and tunnel
        id: tunnel
        env:
          LIVE_SIM_KEY: ${{ secrets.LIVE_SIM_KEY }}
        run: |
          if [ -z "$LIVE_SIM_KEY" ]; then
            echo "::error::Set the repository secret LIVE_SIM_KEY (any passphrase); the URL is published only encrypted with it."
            exit 1
          fi
          nohup npx -y serve-sim@0.1.47 "$SIM_UDID" > "$RUNNER_TEMP/serve-sim.log" 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:3200 >/dev/null && break; sleep 2; done
          nohup cloudflared tunnel --no-autoupdate --protocol http2 --url http://localhost:3200 > "$RUNNER_TEMP/tunnel.log" 2>&1 &
          URL=""
          for i in $(seq 1 60); do
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' "$RUNNER_TEMP/tunnel.log" | head -1 || true)
            [ -n "$URL" ] && break; sleep 2
          done
          [ -n "$URL" ] || { echo "::error::no tunnel URL"; exit 1; }
          echo "::add-mask::$URL"
          echo "local preview: $(curl -s -o /dev/null -w '%{http_code}' http://localhost:3200)"
          sleep 10; echo "via tunnel: $(curl -s -o /dev/null -w '%{http_code}' "$URL")"
          # Anyone with the URL controls a simulator running the app built with real secrets, and this
          # repository is public: publish it only encrypted (AES-256-CBC, PBKDF2, key = LIVE_SIM_KEY).
          OPENSSL="$(brew --prefix openssl@3)/bin/openssl"
          ENC=$(printf '%s' "$URL" | "$OPENSSL" enc -aes-256-cbc -pbkdf2 -salt -a -A -pass env:LIVE_SIM_KEY)
          [ "${#ENC}" -le 140 ] || { echo "::error::encrypted URL longer than a commit status description"; exit 1; }
          echo "enc=$ENC" >> "$GITHUB_OUTPUT"
      # Job logs and summaries are only readable after the job ends, so the (encrypted) URL goes into
      # a commit status now. Decrypt locally:
      #   printf '%s' '<description>' | openssl enc -d -aes-256-cbc -pbkdf2 -a -A -pass pass:'<LIVE_SIM_KEY>'
      - name: Publish encrypted URL
        env:
          GH_TOKEN: ${{ github.token }}
          ENC: ${{ steps.tunnel.outputs.enc }}
        run: |
          jq -n --arg d "$ENC" '{state: "success", context: "live-sim", description: $d}' \
            | curl -sf -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" -d @- >/dev/null
          echo "Encrypted URL posted as commit status 'live-sim'."
      - name: Keep online
        env:
          MINUTES: ${{ inputs.minutes }}
        run: |
          M=${MINUTES:-45}; [ "$M" -gt 300 ] && M=300
          end=$(( $(date +%s) + M*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do sleep 30; done
      - name: Logs
        if: always()
        run: |
          # Tunnel URLs are dead once the job ends; strip them anyway.
          tail -50 "$RUNNER_TEMP/serve-sim.log" 2>/dev/null | sed -E 's#https://[a-z0-9-]+\.trycloudflare\.com#<tunnel-url>#g' || true
          tail -20 "$RUNNER_TEMP/tunnel.log" 2>/dev/null | sed -E 's#https://[a-z0-9-]+\.trycloudflare\.com#<tunnel-url>#g' || true
